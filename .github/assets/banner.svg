<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Kettle UI by Apurva: a toy train crossing green hills">
  <style>
    .ink { stroke: #1a1714; stroke-width: 4; stroke-linejoin: round; }
    .title { font: 900 124px/1 "Arial Black", "Helvetica Neue", Arial, sans-serif; letter-spacing: -5px; }
    .mono { font: 600 18px "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: 4px; }
    .sticker-text { font: 900 30px "Arial Black", Arial, sans-serif; }
    .sun { animation: pulse 5s ease-in-out infinite; transform-origin: 1040px 92px; }
    .cloud-a { animation: drift 30s linear infinite; }
    .cloud-b { animation: drift 44s linear -18s infinite; }
    .train { animation: ride 13s linear infinite; }
    .bob { animation: bob 0.4s ease-in-out infinite; }
    .wheel { animation: spin 0.6s linear infinite; transform-box: fill-box; transform-origin: center; }
    .puff { animation: puff 1.4s ease-out infinite; opacity: 0; transform-box: fill-box; transform-origin: center; }
    .puff:nth-of-type(2) { animation-delay: 0.45s; }
    .puff:nth-of-type(3) { animation-delay: 0.9s; }
    .sticker { animation: wobble 3.2s ease-in-out infinite; transform-origin: 175px 232px; }
    .letter { animation: drop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    .note { animation: note 3.6s ease-out infinite; opacity: 0; transform-box: fill-box; }
    .note:nth-of-type(2) { animation-delay: 1.2s; }
    .note:nth-of-type(3) { animation-delay: 2.4s; }
    @keyframes pulse { 50% { transform: scale(1.08); } }
    @keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(1300px); } }
    @keyframes ride { from { transform: translateX(-280px); } to { transform: translateX(1260px); } }
    @keyframes bob { 50% { transform: translateY(-2px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes puff { 0% { opacity: 0; transform: translate(0, 0) scale(0.4); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(-36px, -60px) scale(1.6); } }
    @keyframes wobble { 0%, 100% { transform: rotate(-6deg) translateY(0); } 50% { transform: rotate(-2deg) translateY(-6px); } }
    @keyframes drop { from { opacity: 0; transform: translateY(-120px) rotate(-12deg); } }
    @keyframes note { 0% { opacity: 0; transform: translate(0, 0) rotate(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(14px, -110px) rotate(14deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .puff, .note { opacity: 0; } }
  </style>

  <rect width="1200" height="460" rx="36" fill="#7fd1f5"/>
  <clipPath id="frame"><rect width="1200" height="460" rx="36"/></clipPath>
  <g clip-path="url(#frame)">
    <circle class="sun ink" cx="1040" cy="92" r="46" fill="#ffd43b"/>
    <g class="cloud-a"><path class="ink" d="M0 70a20 20 0 0 1 20-20 30 30 0 0 1 54-6 22 22 0 0 1 36 26Z" fill="#fbf6ea"/></g>
    <g class="cloud-b"><path class="ink" d="M0 130a14 14 0 0 1 14-14 21 21 0 0 1 38-4 15 15 0 0 1 25 18Z" fill="#fbf6ea"/></g>

    <path class="ink" d="M560 330 700 200l70 44 120-150 100 108 70-40 150 128v120H560Z" fill="#8a7cff"/>
    <path class="ink" stroke-width="3" d="m890 94 50 54-24-7-20 20-17-17-30 13Z" fill="#fbf6ea"/>

    <path class="ink" d="M-10 340c180-50 330-56 520-22s420 22 700-24v190H-10Z" fill="#1fa34a"/>
    <g fill="none" stroke="#0f6b30" stroke-width="7" stroke-dasharray="3 16" stroke-linecap="round">
      <path d="M-10 380c300-30 640-12 1220-20"/>
      <path d="M-10 404c300-24 640-8 1220-14"/>
      <path d="M-10 428c300-18 640-4 1220-8"/>
    </g>
    <path d="M-10 356h1220" stroke="#1a1714" stroke-width="5"/>
    <path d="M-10 364h1220" stroke="#1a1714" stroke-width="2.5" stroke-dasharray="5 11"/>

    <g class="train">
      <g transform="translate(232 284)">
        <circle class="puff ink" stroke-width="3" r="11" fill="#fbf6ea"/>
        <circle class="puff ink" stroke-width="3" r="13" fill="#fbf6ea"/>
        <circle class="puff ink" stroke-width="3" r="15" fill="#fbf6ea"/>
      </g>
      <g class="bob">
        <rect class="ink" x="0" y="310" width="72" height="38" rx="6" fill="#ff4fb8"/>
        <rect class="ink" stroke-width="2.5" x="10" y="319" width="16" height="13" rx="2" fill="#fbf6ea"/>
        <rect class="ink" stroke-width="2.5" x="36" y="319" width="16" height="13" rx="2" fill="#fbf6ea"/>
        <rect class="ink" x="82" y="310" width="72" height="38" rx="6" fill="#ffd43b"/>
        <rect class="ink" stroke-width="2.5" x="92" y="319" width="16" height="13" rx="2" fill="#fbf6ea"/>
        <rect class="ink" stroke-width="2.5" x="118" y="319" width="16" height="13" rx="2" fill="#fbf6ea"/>
        <rect class="ink" x="164" y="300" width="42" height="48" rx="5" fill="#ff4b1f"/>
        <rect class="ink" stroke-width="2.5" x="172" y="308" width="22" height="16" rx="2" fill="#fbf6ea"/>
        <rect class="ink" x="206" y="320" width="48" height="28" rx="9" fill="#ff4b1f"/>
        <rect x="226" y="290" width="13" height="30" fill="#1a1714"/>
      </g>
      <g fill="#1a1714">
        <g class="wheel"><circle cx="20" cy="352" r="9"/><rect x="18.5" y="344" width="3" height="16" fill="#fbf6ea"/></g>
        <g class="wheel"><circle cx="54" cy="352" r="9"/><rect x="52.5" y="344" width="3" height="16" fill="#fbf6ea"/></g>
        <g class="wheel"><circle cx="102" cy="352" r="9"/><rect x="100.5" y="344" width="3" height="16" fill="#fbf6ea"/></g>
        <g class="wheel"><circle cx="136" cy="352" r="9"/><rect x="134.5" y="344" width="3" height="16" fill="#fbf6ea"/></g>
        <g class="wheel"><circle cx="186" cy="352" r="9"/><rect x="184.5" y="344" width="3" height="16" fill="#fbf6ea"/></g>
        <g class="wheel"><circle cx="236" cy="352" r="9"/><rect x="234.5" y="344" width="3" height="16" fill="#fbf6ea"/></g>
      </g>
    </g>

    <g transform="translate(1000 372)">
      <ellipse class="ink" cx="50" cy="62" rx="64" ry="11" fill="#fbf6ea"/>
      <path class="ink" d="M4 6h92l-9 46a11 11 0 0 1-11 9H24a11 11 0 0 1-11-9Z" fill="#fbf6ea"/>
      <path d="M96 18a14 14 0 0 1 0 26" fill="none" stroke="#1a1714" stroke-width="5"/>
      <ellipse class="ink" stroke-width="3" cx="50" cy="7" rx="45" ry="6" fill="#ffd43b"/>
    </g>
    <g font-family="Arial Black, Arial, sans-serif" font-size="38" stroke="#1a1714" stroke-width="1.5">
      <text class="note" x="1030" y="380" fill="#ff4b1f">♪</text>
      <text class="note" x="1060" y="380" fill="#ff4fb8">♫</text>
      <text class="note" x="1088" y="380" fill="#ffd43b">♪</text>
    </g>
  </g>

  <g class="title letter" fill="#1a1714">
    <text x="56" y="164">KETTLE <tspan fill="#ff4b1f">UI</tspan></text>
  </g>
  <g class="sticker">
    <rect x="64" y="200" width="222" height="58" rx="29" fill="#1a1714" transform="translate(5 5)"/>
    <rect class="ink" x="64" y="200" width="222" height="58" rx="29" fill="#ff4fb8"/>
    <text class="sticker-text" x="175" y="240" text-anchor="middle" fill="#1a1714">by Apurva ✶</text>
  </g>
  <text class="mono" x="310" y="236" fill="#1a1714">HAND-INKED REACT COMPONENTS</text>
  <rect x="2" y="2" width="1196" height="456" rx="34" fill="none" stroke="#1a1714" stroke-width="4"/>
</svg>
