<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Kettle UI preloader: a toy train chugging along a track while a progress bar fills">
  <style>
    .ink { stroke: #1a1714; stroke-linejoin: round; }
    .title { font: 900 52px/1 "Arial Black", "Helvetica Neue", Arial, sans-serif; letter-spacing: -1.5px; }
    .mono { font: 600 15px "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: 5px; }
    .train { animation: in 1.1s cubic-bezier(0.16, 1, 0.3, 1) both, bob 0.35s ease-in-out 1.1s infinite; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 0.6s linear infinite; }
    .smoke { transform-box: fill-box; animation: puff 1.2s ease-out infinite; }
    .s2 { animation-delay: 0.4s; } .s3 { animation-delay: 0.8s; }
    .ties { animation: ties 0.35s linear infinite; }
    .bar { transform-box: fill-box; transform-origin: left; animation: fill 3s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
    @keyframes in { from { transform: translateX(-520px); } }
    @keyframes bob { 50% { transform: translateY(-3px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes puff { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(-28px, -26px); opacity: 0; } }
    @keyframes ties { to { transform: translateX(-24px); } }
    @keyframes fill { 0% { transform: scaleX(0); } 70%, 100% { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1200" height="320" rx="28" fill="#fbf6ea"/>
  <rect x="1" y="1" width="1198" height="318" rx="27" fill="none" stroke="#1a1714" stroke-width="2"/>
  <defs><clipPath id="track"><rect x="360" y="150" width="480" height="20"/></clipPath></defs>
  <g class="train" transform="translate(0 0)">
    <g transform="translate(510 67) scale(1.55)">
      <circle class="smoke" cx="96" cy="8" r="5" fill="#fbf6ea" stroke="#1a1714" stroke-width="2"/>
      <circle class="smoke s2" cx="96" cy="8" r="6" fill="#fbf6ea" stroke="#1a1714" stroke-width="2"/>
      <circle class="smoke s3" cx="96" cy="8" r="7" fill="#fbf6ea" stroke="#1a1714" stroke-width="2"/>
      <rect x="4" y="22" width="44" height="22" rx="4" fill="#7fd1f5" class="ink" stroke-width="3"/>
      <rect x="10" y="27" width="10" height="8" rx="1" fill="#fbf6ea" class="ink" stroke-width="2"/>
      <rect x="26" y="27" width="10" height="8" rx="1" fill="#fbf6ea" class="ink" stroke-width="2"/>
      <rect x="52" y="16" width="56" height="28" rx="4" fill="#ff4b1f" class="ink" stroke-width="3"/>
      <rect x="90" y="8" width="10" height="10" fill="#1a1714"/>
      <rect x="58" y="21" width="14" height="10" rx="1" fill="#fbf6ea" class="ink" stroke-width="2"/>
      <g class="wheel"><circle cx="16" cy="46" r="7" fill="#1a1714"/><rect x="15" y="40" width="2" height="12" fill="#fbf6ea"/></g>
      <g class="wheel"><circle cx="36" cy="46" r="7" fill="#1a1714"/><rect x="35" y="40" width="2" height="12" fill="#fbf6ea"/></g>
      <g class="wheel"><circle cx="64" cy="46" r="7" fill="#1a1714"/><rect x="63" y="40" width="2" height="12" fill="#fbf6ea"/></g>
      <g class="wheel"><circle cx="92" cy="46" r="7" fill="#1a1714"/><rect x="91" y="40" width="2" height="12" fill="#fbf6ea"/></g>
    </g>
  </g>
  <rect x="360" y="150" width="480" height="4" fill="#1a1714"/>
  <g clip-path="url(#track)"><g class="ties">
    <path d="M362 154v10M386 154v10M410 154v10M434 154v10M458 154v10M482 154v10M506 154v10M530 154v10M554 154v10M578 154v10M602 154v10M626 154v10M650 154v10M674 154v10M698 154v10M722 154v10M746 154v10M770 154v10M794 154v10M818 154v10M842 154v10M866 154v10" stroke="#1a1714" stroke-width="5"/>
  </g></g>
  <text x="600" y="232" text-anchor="middle" class="title" fill="#1a1714">KETTLE <tspan fill="#ff4b1f">UI</tspan></text>
  <text x="600" y="262" text-anchor="middle" class="mono" fill="#615a51">BY APURVA</text>
  <rect x="430" y="280" width="340" height="14" rx="7" fill="#fffdf7" stroke="#1a1714" stroke-width="2.5"/>
  <rect class="bar" x="432" y="282" width="336" height="10" rx="5" fill="#1fa34a"/>
</svg>
