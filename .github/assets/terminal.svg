<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Terminal: npx shadcn add @kettle/pill-button installs the component">
  <style>
    .t { font: 500 22px "SFMono-Regular", Menlo, Consolas, monospace; fill: #fbf6ea; white-space: pre; }
    .p { fill: #ffd43b; } .ok { fill: #1fa34a; } .dim { fill: #fbf6ea; opacity: .55; } .hl { fill: #ff4fb8; }
    .type { animation: type 9s steps(40) infinite; }
    .l2 { animation: show 9s infinite; animation-delay: 0s; }
    .cursor { animation: blink 1s steps(1) infinite, park 9s steps(40) infinite; }
    @keyframes type { 0% { clip-path: inset(0 100% 0 0); } 28%, 100% { clip-path: inset(0 0 0 0); } }
    @keyframes show { 0%, 34% { opacity: 0; } 36%, 96% { opacity: 1; } 100% { opacity: 0; } }
    .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; } .s4 { animation-name: s4; }
    @keyframes s1 { 0%, 36% { opacity: 0; } 38%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes s2 { 0%, 46% { opacity: 0; } 48%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes s3 { 0%, 56% { opacity: 0; } 58%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes s4 { 0%, 66% { opacity: 0; } 68%, 96% { opacity: 1; } 100% { opacity: 0; } }
    .s1, .s2, .s3, .s4 { animation-duration: 9s; animation-iteration-count: infinite; opacity: 0; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes park { 0% { transform: translateX(0); } 28%, 100% { transform: translateX(475px); } }
    @media (prefers-reduced-motion: reduce) { .type, .cursor { animation: none; } .s1, .s2, .s3, .s4 { animation: none; opacity: 1; } }
  </style>
  <rect x="8" y="8" width="1188" height="318" rx="28" fill="#1a1714"/>
  <rect x="2" y="2" width="1188" height="318" rx="28" fill="#1a1714" stroke="#1a1714" stroke-width="4"/>
  <rect x="2" y="2" width="1188" height="56" rx="28" fill="#2a2520"/>
  <rect x="2" y="30" width="1188" height="28" fill="#2a2520"/>
  <circle cx="40" cy="30" r="9" fill="#ff4b1f"/><circle cx="68" cy="30" r="9" fill="#ffd43b"/><circle cx="96" cy="30" r="9" fill="#1fa34a"/>
  <text x="595" y="37" text-anchor="middle" class="t dim" style="font-size:16px">~/my-app</text>

  <text x="40" y="112" class="t"><tspan class="p">$ </tspan></text>
  <g class="type"><text x="70" y="112" class="t">npx shadcn add @kettle/pill-button</text></g>
  <rect class="cursor" x="72" y="92" width="12" height="26" fill="#ffd43b"/>

  <text x="40" y="160" class="t s1"><tspan class="ok">✔</tspan> Checking registry.</text>
  <text x="40" y="196" class="t s2"><tspan class="ok">✔</tspan> Installing dependencies. <tspan class="dim">motion, react-icons</tspan></text>
  <text x="40" y="232" class="t s3"><tspan class="ok">✔</tspan> Created <tspan class="hl">components/kit/PillButton.tsx</tspan></text>
  <text x="40" y="268" class="t s4"><tspan class="ok">✔</tspan> Updating app/globals.css <tspan class="dim">(tokens, shadows, keyframes)</tspan></text>
</svg>
