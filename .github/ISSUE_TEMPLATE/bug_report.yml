name: Bug report
description: A component or the docs site doesn't work as expected.
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: Which component, or which docs page?
      placeholder: pill-button
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead. Screenshots or clips help.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npx shadcn@latest add @kettle/...
        2. Render <...> with ...
        3. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser, OS, React / Next.js / Tailwind versions.
      placeholder: Chrome 140, macOS, Next 16.4, Tailwind 4.1
    validations:
      required: true
